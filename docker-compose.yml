services:
  mongo:
    image: mongo:7
    container_name: task-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: task-notification-service
    restart: unless-stopped
    environment:
      PORT: 4005
    expose:
      - "4005"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4005/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: task-auth-service
    restart: unless-stopped
    environment:
      PORT: 4002
      MONGO_URI: mongodb://mongo:27017/task_manager
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
      NOTIFICATION_SERVICE_URL: http://notification-service:4005
    depends_on:
      mongo:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    expose:
      - "4002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: task-user-service
    restart: unless-stopped
    environment:
      PORT: 4003
      MONGO_URI: mongodb://mongo:27017/task_manager
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "4003"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4003/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  task-service:
    build:
      context: ./task-service
      dockerfile: Dockerfile
    container_name: task-task-service
    restart: unless-stopped
    environment:
      PORT: 4004
      MONGO_URI: mongodb://mongo:27017/task_manager
      NOTIFICATION_SERVICE_URL: http://notification-service:4005
    depends_on:
      mongo:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    expose:
      - "4004"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4004/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: task-api-gateway
    restart: unless-stopped
    environment:
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
      AUTH_SERVICE_URL: http://auth-service:4002
      USER_SERVICE_URL: http://user-service:4003
      TASK_SERVICE_URL: http://task-service:4004
      NOTIFICATION_SERVICE_URL: http://notification-service:4005
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      task-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: task-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  mongo_data:
